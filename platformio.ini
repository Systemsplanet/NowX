; PlatformIO project for NowX
; - esp32dev: on-device build
; - native: host-side unit tests (no Arduino, no ESP-IDF)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -Wall
    -Wextra
    -Wpedantic
    -Wno-unused-parameter
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic
    -Wno-unused-parameter
    -DNOWX_HOST_BUILD
    -Isrc
    -Itest/test_native
build_src_filter =
    +<NxProtocol.cpp>
    +<Log.cpp>
